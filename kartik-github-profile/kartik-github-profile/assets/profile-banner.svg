<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Kartik Yadav — Software, AI, Autonomous Systems</title>
  <desc id="desc">A dark futuristic engineering dashboard with neon cyan and violet accents, telemetry marks, and a wireframe drone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="0.55" stop-color="#10132B"/>
      <stop offset="1" stop-color="#071A28"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55F6FF"/>
      <stop offset="0.55" stop-color="#7C8CFF"/>
      <stop offset="1" stop-color="#D26BFF"/>
    </linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8FCFF"/>
      <stop offset="0.58" stop-color="#B9C8FF"/>
      <stop offset="1" stop-color="#72F5F0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6ACDE4" stroke-opacity=".12" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#68E9EE" fill-opacity=".25"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#4DEBFF" stop-opacity=".21"/>
      <stop offset="1" stop-color="#4DEBFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <ellipse cx="930" cy="180" rx="300" ry="240" fill="url(#glow)"/>
    <circle cx="1030" cy="185" r="160" fill="#8B5CF6" opacity=".11" filter="url(#blur)"/>
    <path d="M0 315 C240 260 340 395 610 315 S965 285 1200 220" fill="none" stroke="#5CEAF3" stroke-opacity=".17" stroke-width="1.5"/>
    <path d="M0 330 C230 275 395 410 650 330 S1000 310 1200 245" fill="none" stroke="#9A7CFF" stroke-opacity=".2" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8CDCEB">
      <text x="48" y="42" font-size="12" letter-spacing="3" opacity=".9">KARTIK YADAV / ENGINEERING LOG</text>
      <text x="1152" y="42" font-size="11" text-anchor="end" letter-spacing="2" opacity=".65">SYS.001 — ONLINE</text>
      <path d="M48 58H1152" stroke="url(#stroke)" stroke-opacity=".65"/>
      <circle cx="50" cy="58" r="3" fill="#61F6EB"/>
    </g>

    <g transform="translate(50 104)">
      <rect width="8" height="8" fill="#5FF5F0"/>
      <text x="20" y="9" font-family="ui-monospace, monospace" font-size="13" fill="#70F5EB" letter-spacing="2">IDEAS / SYSTEMS / IMPACT</text>
      <text x="-2" y="82" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="65" letter-spacing="-2.4" fill="url(#type)">KARTIK YADAV</text>
      <text x="0" y="122" font-family="ui-monospace, monospace" font-size="19" fill="#F0F5FF" letter-spacing="3">SOFTWARE  /  AI  /  AUTONOMOUS SYSTEMS</text>
      <text x="0" y="158" font-family="ui-monospace, monospace" font-size="14" fill="#90A7CB">Building useful things at the edge of code and reality.</text>
      <g transform="translate(0 190)" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.5">
        <rect width="145" height="28" rx="4" fill="#0D2436" stroke="#34DDE9" stroke-opacity=".65"/>
        <text x="72.5" y="18" text-anchor="middle" fill="#70EFF4">PRODUCT ENGINEERING</text>
        <rect x="155" width="105" height="28" rx="4" fill="#151C3C" stroke="#8B79FF" stroke-opacity=".7"/>
        <text x="207.5" y="18" text-anchor="middle" fill="#C0B7FF">AI SYSTEMS</text>
        <rect x="270" width="130" height="28" rx="4" fill="#0D2E2D" stroke="#59E1BB" stroke-opacity=".7"/>
        <text x="335" y="18" text-anchor="middle" fill="#8CF0CE">DRONE R&amp;D</text>
      </g>
    </g>

    <!-- schematic drone / autonomous system -->
    <g transform="translate(930 190)" fill="none" stroke="url(#stroke)" stroke-width="2" stroke-linejoin="round" filter="url(#neon)">
      <circle r="132" stroke-opacity=".35" stroke-dasharray="5 9"/>
      <circle r="108" stroke-opacity=".32" stroke-dasharray="2 9"/>
      <circle r="76" stroke-opacity=".3"/>
      <path d="M-112 0H-77 M77 0H112 M0 -112V-77 M0 77V112" stroke-opacity=".5"/>
      <path d="M-30 -12L-66 -44L-92 -44 M30 -12L66 -44L92 -44 M-30 12L-66 44L-92 44 M30 12L66 44L92 44"/>
      <path d="M-30 -12L0 -27L30 -12L30 12L0 27L-30 12Z" fill="#152C47" fill-opacity=".9"/>
      <path d="M-9 -5L0 -11L9 -5L9 5L0 11L-9 5Z" fill="#72F5F0" fill-opacity=".28"/>
      <ellipse cx="-91" cy="-44" rx="24" ry="7" transform="rotate(-22 -91 -44)" stroke-width="1.5"/>
      <ellipse cx="91" cy="-44" rx="24" ry="7" transform="rotate(22 91 -44)" stroke-width="1.5"/>
      <ellipse cx="-91" cy="44" rx="24" ry="7" transform="rotate(22 -91 44)" stroke-width="1.5"/>
      <ellipse cx="91" cy="44" rx="24" ry="7" transform="rotate(-22 91 44)" stroke-width="1.5"/>
      <path d="M-9 -27L-17 -40 M9 -27L17 -40 M-9 27L-17 40 M9 27L17 40" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#E5FFFF" stroke="none"/>
    </g>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#79DCE7" opacity=".85">
      <text x="1070" y="106">FLIGHT / CONTROL</text>
      <path d="M1058 112L1022 136" stroke="#79DCE7" stroke-opacity=".65"/>
      <text x="1057" y="294">AUTONOMY // R&amp;D</text>
      <path d="M1050 284L1017 263" stroke="#79DCE7" stroke-opacity=".65"/>
      <text x="800" y="328">[ 01 ] SIGNAL ACQUIRED</text>
    </g>

    <g transform="translate(48 350)" font-family="ui-monospace, monospace" font-size="10" fill="#8AA7C5" letter-spacing="1.4">
      <text>STAY CURIOUS</text><circle cx="116" cy="-4" r="2" fill="#5FF5F0"/>
      <text x="132">SHIP OFTEN</text><circle cx="236" cy="-4" r="2" fill="#9F8CFF"/>
      <text x="252">VERIFY EVERYTHING</text>
      <text x="1104" text-anchor="end">IN / BUILD MODE</text>
    </g>
    <rect x="1" y="1" width="1198" height="378" rx="22" fill="none" stroke="url(#stroke)" stroke-opacity=".6"/>
    <path d="M28 1H150M1050 379H1172" stroke="#71F5F0" stroke-width="2"/>
  </g>
</svg>
